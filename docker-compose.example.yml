# Copy to docker-compose.yml and adjust for your setup.
services:
  dsite:
    # Build locally with `docker build -t dsite .` or use a published image.
    image: dsite
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /data:/data
    environment:
      - SITE_TITLE=My Blog
      - SITE_DESC=Photos and notes
      - SITE_URL=https://example.com
      # Behind a reverse proxy on the same host: trust X-Forwarded-For
      # (otherwise the login rate limiter sees every visitor as the proxy IP).
      - TRUSTED_PROXY=true
      - GOMEMLIMIT=400MiB
      # Optional: also push each backup archive to Yandex Disk (BACKUP_DIR
      # already defaults to /data/backups, on the persisted volume, so the
      # local copy needs no extra config). Get a token with the
      # cloud_api:disk.write scope from an app at https://oauth.yandex.ru.
      # - BACKUP_REMOTE=yadisk
      # - YADISK_TOKEN=
    mem_limit: 512m
    cpus: "0.5"
