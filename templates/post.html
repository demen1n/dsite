{{define "content"}}
{{with .Data}}
<article>
  <div style="margin-bottom:0.5rem; font-size:0.85rem; color:var(--muted); display:flex; align-items:center; gap:1rem; flex-wrap:wrap">
    <a href="/" style="color:var(--muted)">← Назад</a>
    <span>{{relDate .CreatedAt}}</span>
    {{if .Views}}<span>{{.Views}} просм.</span>{{end}}
    {{if .Tags}}
    <span class="post-tags">
      {{range .Tags}}<a href="/?tag={{.}}" class="tag-inline">{{.}}</a>{{end}}
    </span>
    {{end}}
  </div>
  <h1>{{.Title}}</h1>
  {{if .Cover}}
  <img src="/uploads/{{.Cover}}" alt="{{.Title}}"
       style="width:100%; max-height:480px; object-fit:cover; border-radius:var(--radius); margin:1.5rem 0;">
  {{end}}
  <div class="prose">
    {{safeHTML .BodyHTML}}
  </div>
</article>
{{end}}
{{end}}
