{{define "admin_base"}}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Админка</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/htmx.min.js"></script>
  {{block "admin_head" .}}{{end}}
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><a href="/admin">⚡ Админка</a></div>
    <nav>
      <a href="/admin" {{if eq .Title "Панель управления"}}class="active"{{end}}>Посты</a>
      <a href="/admin/gallery" {{if eq .Title "Галерея"}}class="active"{{end}}>Галерея</a>
      <a href="/admin/resume" {{if eq .Title "Резюме"}}class="active"{{end}}>Резюме</a>
      <a href="/admin/uploads" {{if eq .Title "Файлы"}}class="active"{{end}}>Файлы</a>
      <a href="/admin/settings" {{if eq .Title "Настройки"}}class="active"{{end}}>Настройки</a>
      <a href="/" target="_blank" style="margin-top:0.5rem">↗ Сайт</a>
    </nav>
    <div class="sidebar-bottom">
      <form method="POST" action="/admin/logout">
        <button type="submit">Выйти</button>
      </form>
    </div>
  </aside>
  <div class="admin-content">
    {{block "admin_content" .}}{{end}}
  </div>
  {{block "admin_scripts" .}}{{end}}
</body>
</html>
{{end}}
