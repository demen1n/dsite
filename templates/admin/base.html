{{define "admin_base"}}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Админка</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f4f0; --surface: #fff; --text: #1a1a1a; --muted: #6b6b6b;
      --border: #e0e0da; --accent: #2563eb; --accent-h: #1d4ed8;
      --danger: #dc2626; --sidebar-w: 200px; --radius: 8px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 100vh; padding: 1.5rem 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .sidebar-logo { padding: 0 1.25rem 1.5rem; font-weight: 700; font-size: 1.05rem; color: var(--text); }
    .sidebar-logo a { color: inherit; }
    .sidebar-logo a:hover { text-decoration: none; }
    .sidebar nav { display: flex; flex-direction: column; gap: 0.15rem; padding: 0 0.75rem; }
    .sidebar nav a { padding: 0.55rem 0.75rem; border-radius: 6px; color: var(--muted); font-size: 0.92rem; }
    .sidebar nav a:hover { background: var(--bg); color: var(--text); text-decoration: none; }
    .sidebar nav a.active { background: #eff6ff; color: var(--accent); font-weight: 500; }
    .sidebar-bottom { margin-top: auto; padding: 1rem 0.75rem 0; }
    .sidebar-bottom form button { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; color: var(--muted); font-size: 0.88rem; }
    .sidebar-bottom form button:hover { background: var(--bg); }
    .admin-content { flex: 1; padding: 2rem 2.5rem; max-width: 1100px; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
    .admin-header h1 { font-size: 1.6rem; font-weight: 700; }
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { background: var(--bg); text-align: left; padding: 0.75rem 1rem; font-size: 0.82rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    td { padding: 0.85rem 1rem; border-top: 1px solid var(--border); font-size: 0.92rem; vertical-align: middle; }
    tr:hover td { background: #fafaf8; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.88rem; font-weight: 500; margin-bottom: 0.4rem; color: var(--muted); }
    input[type=text], input[type=password], textarea, select { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; font-family: inherit; background: var(--surface); color: var(--text); transition: border-color .15s; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1.1rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: background .15s; }
    .btn:hover { text-decoration: none; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #d5d5d0; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: .85; }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.82rem; }
    .badge { display: inline-block; padding: 0.2em 0.6em; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-gray { background: #f0f0ee; color: #6b7280; }
    .editor-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .editor-layout textarea { min-height: 460px; font-family: 'Menlo', 'Consolas', monospace; font-size: 0.88rem; line-height: 1.6; }
    .preview-pane { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; overflow-y: auto; min-height: 460px; }
    .preview-pane p { margin-bottom: 1rem; }
    .preview-pane h2 { margin: 1.5rem 0 0.5rem; }
    .preview-pane img { max-width: 100%; border-radius: 6px; }
    .preview-pane code { background: #f0f0ee; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.87em; }
    .preview-pane pre { background: #1e1e2e; color: #cdd6f4; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    .preview-pane blockquote { border-left: 3px solid var(--border); padding-left: 1rem; color: var(--muted); }
  </style>
  {{block "admin_head" .}}{{end}}
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><a href="/admin">⚡ Админка</a></div>
    <nav>
      <a href="/admin" {{if eq .Title "Панель управления"}}class="active"{{end}}>Посты</a>
      <a href="/admin/gallery" {{if eq .Title "Галерея"}}class="active"{{end}}>Галерея</a>
      <a href="/admin/resume" {{if eq .Title "Резюме"}}class="active"{{end}}>Резюме</a>
      <a href="/admin/uploads" {{if eq .Title "Файлы"}}class="active"{{end}}>Файлы</a>
      <a href="/admin/settings" {{if eq .Title "Настройки"}}class="active"{{end}}>Настройки</a>
      <a href="/" target="_blank" style="margin-top:0.5rem">↗ Сайт</a>
    </nav>
    <div class="sidebar-bottom">
      <form method="POST" action="/admin/logout">
        <button type="submit">Выйти</button>
      </form>
    </div>
  </aside>
  <div class="admin-content">
    {{block "admin_content" .}}{{end}}
  </div>
  {{block "admin_scripts" .}}{{end}}
</body>
</html>
{{end}}
