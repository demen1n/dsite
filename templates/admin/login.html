{{define "login.html"}}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border: 1px solid #e0e0da; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; }
    h1 { font-size: 1.4rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.35rem; font-weight: 500; }
    input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #e0e0da; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1.1rem; box-sizing: border-box; }
    input:focus { outline: none; border-color: #2563eb; }
    button { width: 100%; padding: 0.65rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход в админку</h1>
    {{if .Data}}<div class="error">{{.Data}}</div>{{end}}
    <form method="POST" action="/admin/login">
      <label>Логин</label>
      <input type="text" name="login" autocomplete="username" autofocus required>
      <label>Пароль</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
{{end}}
