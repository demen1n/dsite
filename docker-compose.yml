services:
  dsite:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /data:/data
    environment:
      - SECURE_COOKIES=true
      - SITE_TITLE=${SITE_TITLE:-My Blog}
      - SITE_DESC=${SITE_DESC:-Фото и заметки}
    mem_limit: 256m
    cpus: "0.5"
